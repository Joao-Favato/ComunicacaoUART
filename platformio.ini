[env]
platform = freescalekinetis
board = frdm_kl25z
framework = zephyr
platform_packages =
    framework-zephyr @ ~3.40200.0
build_flags = -DFSL_FEATURE_TPM_HAS_32BIT_COUNTERn(x)=0
monitor_speed = 115200

[env:kl25z_a]
; No Windows use COMx (ex.: COM3); no Linux /dev/ttyACM0
monitor_port = /dev/ttyACM0

